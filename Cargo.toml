[package]
name = "reqradar"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.82"
description = "Capture, inspect and replay HTTP from your terminal. Local reverse proxy, .rrlog storage, Markdown bug reports."
authors = ["ReqRadar contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/toriyama237/reqradar"
homepage = "https://github.com/toriyama237/reqradar"
keywords = ["http", "proxy", "debugging", "cli", "networking"]
categories = ["command-line-utilities", "development-tools::debugging"]

[lib]
name = "reqradar"
path = "src/lib.rs"

[[bin]]
name = "reqradar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "io-util", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["server", "client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
